<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<title>YGG Vault</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
<header><div><small>YGG METRO</small><h1>YGG VAULT</h1></div><button id="lock" class="ghost hidden">Lock</button></header>

<section id="auth" class="card auth">
<h2>เปิด Vault</h2><p>ข้อมูลเก็บในเครื่องแบบเข้ารหัส</p>
<label>Master Password<input id="master" type="password" autocomplete="current-password" placeholder="••••••••••"></label>
<button id="unlock" class="primary">Unlock / Create</button>
<p class="tiny">ถ้าลืม Master Password จะถอดรหัส Vault เดิมไม่ได้</p>
</section>

<section id="vault" class="hidden">
<div class="card toolbar">
<input id="search" placeholder="ค้นหา…">
<select id="filter"><option value="">ทุกหมวด</option><option>LOGIN</option><option>API KEYS</option><option>GO HUB</option><option>SALES</option><option>BACKUP</option></select>
<button id="add" class="primary">+ เพิ่ม</button>
</div>
<div id="list"></div>
<div class="card backup"><h3>Backup</h3><p>Export เป็น ciphertext ไม่มี secret plaintext</p>
<button id="export" class="ghost">Export Encrypted</button>
<label class="ghost file">Import Encrypted<input id="import" type="file" accept=".json,application/json" hidden></label>
</div>
</section>
</main>

<dialog id="dlg">
<form id="form" class="card modal">
<div class="modalHead"><div><small>ENTRY</small><h2 id="formTitle">เพิ่มรายการ</h2></div><button type="button" id="close" class="ghost">×</button></div>
<input id="id" type="hidden">
<div class="grid">
<label>ชื่อ *<input id="title" required></label>
<label>หมวด *<select id="group" required><option value="">เลือก</option><option>LOGIN</option><option>API KEYS</option><option>GO HUB</option><option>SALES</option><option>BACKUP</option></select></label>
<label>ประเภท *<select id="type" required><option>Password</option><option>API Key</option><option>OAuth</option><option>Token</option><option>Passcode</option><option>Identifier</option></select></label>
<label>สถานะ<select id="status"><option>Active</option><option>Unknown</option><option>Revoked</option></select></label>
</div>

<label>Username / ID<div class="field"><input id="username"><button type="button" data-copy="username">Copy</button></div></label>

<div id="oauth" class="grid hidden">
<label>Client ID *<div class="field"><input id="clientId"><button type="button" data-copy="clientId">Copy</button></div></label>
<label>Client Secret *<div class="field"><input id="clientSecret" type="password"><button type="button" data-show="clientSecret">👁</button><button type="button" data-copy="clientSecret">Copy</button></div></label>
<label class="span2">Resource / Redirect URL<div class="field"><input id="resourceUrl"><button type="button" data-copy="resourceUrl">Copy</button></div></label>
</div>

<label id="secretWrap">Secret / Password / Token <span id="secretStar">*</span>
<div class="field"><input id="secret" type="password"><button type="button" data-show="secret">👁</button><button type="button" data-copy="secret">Copy</button></div>
</label>

<label>URL<div class="field"><input id="url" type="url"><button type="button" data-open="url">↗</button><button type="button" data-copy="url">Copy</button></div></label>
<label>Note<textarea id="notes" rows="3"></textarea></label>
<div class="actions"><button type="button" id="delete" class="danger hidden">Delete</button><span></span><button type="button" id="cancel" class="ghost">Cancel</button><button class="primary">Save</button></div>
</form>
</dialog>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body></html>
