name: Phase 1 Deploy Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-gate:
    name: Cloudflare upload safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable filenames
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression, syntax, and UTF-8 gates
        run: npm run deploy:gate

  deploy:
    name: Deploy YGPH Metropolis to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: safety-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production commit
        uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.68.0"
          command: deploy
