name: LIGHTHOUSE APK Debug

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/lighthouse-apk-foundation-proof-*'
    paths:
      - 'android-shell/**'
      - 'lighthouse/**'
      - 'greenfield/**'
      - '.github/workflows/lighthouse-apk-debug.yml'
  pull_request:
    paths:
      - 'android-shell/**'
      - 'lighthouse/**'
      - 'greenfield/**'
      - '.github/workflows/lighthouse-apk-debug.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Verify foundation contract
        run: npm test

      - name: Build integrated 0.0.3 signing source
        run: node tools/build-front-door-0.0.3-source.mjs release/front-door-0.0.3/input.generated.json

      - name: Upload integrated 0.0.3 signing source
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-front-door-0.0.3-signing-source
          path: android-shell/release/front-door-0.0.3/input.generated.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: npm run android:debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-debug-apk
          path: android-shell/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
