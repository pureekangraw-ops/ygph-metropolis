name: LIGHTHOUSE APK Debug

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-shell/**'
      - 'ui/**'
      - 'lighthouse/**'
      - 'styles/**'
      - 'sw.js'
      - '.github/workflows/lighthouse-apk-debug.yml'

permissions:
  contents: write

jobs:
  build-existing-full-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Capture source identity
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Stage existing repository application
        run: npm run app:stage-existing

      - name: Prove Android package is existing app, not replacement UI
        run: node --test test/existing-full-app-package.test.mjs

      - name: Generate Android project
        run: npx cap add android

      - name: Sync exact staged web assets
        run: npx cap sync android

      - name: Inject LIGHTHOUSE APK updater bridge
        run: npm run android:updater:apply

      - name: Apply canonical Android version
        run: node tools/set-android-version.mjs

      - name: Apply generated Android security baseline
        run: npm run android:security:apply

      - name: Materialize merged release manifest
        run: cd android && ./gradlew :app:processReleaseMainManifest

      - name: Verify generated Android security
        run: npm run android:security:verify

      - name: Build unsigned release APK
        run: npm run android:release

      - name: Materialize canonical APK signer
        env:
          LIGHTHOUSE_APK_KEYSTORE_BASE64: ${{ secrets.LIGHTHOUSE_APK_KEYSTORE_BASE64 }}
          LIGHTHOUSE_APK_STORE_PASSWORD: ${{ secrets.LIGHTHOUSE_APK_STORE_PASSWORD }}
          LIGHTHOUSE_APK_KEY_ALIAS: ${{ secrets.LIGHTHOUSE_APK_KEY_ALIAS }}
          LIGHTHOUSE_APK_KEY_PASSWORD: ${{ secrets.LIGHTHOUSE_APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in LIGHTHOUSE_APK_KEYSTORE_BASE64 LIGHTHOUSE_APK_STORE_PASSWORD LIGHTHOUSE_APK_KEY_ALIAS LIGHTHOUSE_APK_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured"; exit 1; fi
          done
          umask 077
          keystore="$RUNNER_TEMP/lighthouse-apk-release.p12"
          aligned_apk="$RUNNER_TEMP/lighthouse-release-aligned.apk"
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="android/app/build/outputs/apk/release/lighthouse-release.apk"
          trap 'rm -f "$keystore" "$aligned_apk"' EXIT
          printf '%s' "$LIGHTHOUSE_APK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          zipalign="$build_tools/zipalign"
          test -x "$apksigner" && test -x "$aapt" && test -x "$zipalign"
          "$zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass "env:LIGHTHOUSE_APK_STORE_PASSWORD" \
            --ks-key-alias "$LIGHTHOUSE_APK_KEY_ALIAS" \
            --key-pass "env:LIGHTHOUSE_APK_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$aligned_apk"
          "$apksigner" verify "$signed_apk"
          echo "APKSIGNER=$apksigner" >> "$GITHUB_ENV"
          echo "AAPT=$aapt" >> "$GITHUB_ENV"

      - name: Verify final APK identity
        env:
          APK_SOURCE_COMMIT: ${{ env.SOURCE_SHA }}
        run: node tools/verify-apk-identity.mjs android/app/build/outputs/apk/release/lighthouse-release.apk release/apk-identity-evidence.json

      - name: Publish immutable repository APK assets
        working-directory: .
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "require('./android-shell/version.json').versionName")"
          VERSION_CODE="$(node -p "require('./android-shell/version.json').versionCode")"
          APK_SOURCE="android-shell/android/app/build/outputs/apk/release/lighthouse-release.apk"
          ASSET_DIR="release/assets/${VERSION_NAME}"
          APK_NAME="LIGHTHOUSE-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          APK_PATH="${ASSET_DIR}/${APK_NAME}"
          NOTES_PATH="${ASSET_DIR}/RELEASE-NOTES.md"
          SUMS_PATH="${ASSET_DIR}/SHA256SUMS.txt"
          APK_SHA="$(sha256sum "$APK_SOURCE" | awk '{print $1}')"
          RELEASE_NOTES="คืน direct startup, เก็บ Snapshot เป็น release evidence, และเพิ่ม Settings in-app APK updater"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -e "$APK_PATH" ]; then
            EXISTING_SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"
            if [ "$EXISTING_SHA" != "$APK_SHA" ]; then
              echo "UPDATE_ASSET_EXISTS_WITH_DIFFERENT_SHA"
              exit 1
            fi
            test -f "$NOTES_PATH" && test -f "$SUMS_PATH"
          else
            mkdir -p "$ASSET_DIR"
            cp "$APK_SOURCE" "$APK_PATH"
            printf '%s  %s\n' "$APK_SHA" "$APK_NAME" > "$SUMS_PATH"
            printf '# LIGHTHOUSE %s\n\n- versionCode: %s\n- SHA-256: `%s`\n- %s\n' "$VERSION_NAME" "$VERSION_CODE" "$APK_SHA" "$RELEASE_NOTES" > "$NOTES_PATH"
            git add "$APK_PATH" "$SUMS_PATH" "$NOTES_PATH"
            git commit -m "release: add immutable LIGHTHOUSE ${VERSION_NAME} vc${VERSION_CODE} APK"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

          ASSET_COMMIT="$(git log --diff-filter=A --format=%H -- "$APK_PATH" | tail -1)"
          test -n "$ASSET_COMMIT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "ASSET_COMMIT=$ASSET_COMMIT" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$RELEASE_NOTES" >> "$GITHUB_ENV"

      - name: Verify immutable Raw APK
        working-directory: .
        run: |
          set -euo pipefail
          RAW_URL="https://raw.githubusercontent.com/pureekangraw-ops/ygph-metropolis/${ASSET_COMMIT}/${APK_PATH}"
          curl --fail --location --retry 5 --retry-delay 2 "$RAW_URL" --output "$RUNNER_TEMP/raw-lighthouse.apk"
          RAW_SHA="$(sha256sum "$RUNNER_TEMP/raw-lighthouse.apk" | awk '{print $1}')"
          test "$RAW_SHA" = "$APK_SHA"
          echo "RAW_APK_URL=$RAW_URL" >> "$GITHUB_ENV"

      - name: Publish update manifest
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p release
          node android-shell/tools/build-update-metadata.mjs \
            android-shell/android/app/build/outputs/apk/release/lighthouse-release.apk \
            android-shell/release/apk-identity-evidence.json \
            release/lighthouse-update.json \
            "$RAW_APK_URL" \
            "$RELEASE_NOTES" \
            1004 \
            false
          git add release/lighthouse-update.json
          if git diff --cached --quiet; then
            echo "Manifest already points to verified immutable APK"
          else
            git commit -m "release: open LIGHTHOUSE ${VERSION_NAME} update manifest"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Upload owner-test APK
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-existing-full-app-1.0.4
          path: |
            android-shell/android/app/build/outputs/apk/release/lighthouse-release.apk
            android-shell/release/apk-identity-evidence.json
            android-shell/release/android-security-evidence.json
            release/lighthouse-update.json
            release/assets/1.0.4/SHA256SUMS.txt
            release/assets/1.0.4/RELEASE-NOTES.md
            android-shell/www/effective-base-manifest.json
          if-no-files-found: error
          retention-days: 14
