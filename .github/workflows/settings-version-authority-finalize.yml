name: Temporary Settings Version Authority Finalize

on:
  push:
    branches:
      - fix/visual-version-authority-followthrough

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[settings-version-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visual-version-authority-followthrough
      - run: python3 scripts/finalize-settings-version-authority.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html metropolis-r5-4.js sw.js RELEASE_MANIFEST.json tests docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: bind settings version to shared authority [settings-version-finalized]"
          git push origin HEAD:fix/visual-version-authority-followthrough
