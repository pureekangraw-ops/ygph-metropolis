name: Mobile Flow Apply
on:
  push:
    branches: [feature/mobile-flow-cleanup-v1]
    paths:
      - scripts/apply-calendar-reschedule.py
      - scripts/apply-mobile-ui.py
      - scripts/apply-mobile-tests.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/mobile-flow-cleanup-v1
      - name: Repair literal regex replacement helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-mobile-ui.py')
          if p.exists():
              t=p.read_text(encoding='utf-8')
              t=t.replace("re.subn(pattern, repl, text, count=1, flags=re.S)", "re.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)")
              p.write_text(t,encoding='utf-8')
          PY
      - name: Apply staged patches
        run: |
          for patch in scripts/apply-calendar-reschedule.py scripts/apply-mobile-ui.py scripts/apply-mobile-tests.py; do
            if [ -f "$patch" ]; then python "$patch"; fi
          done
      - name: Commit generated source changes
        run: |
          git config user.name "pureekangraw-ops"
          git config user.email "pureekangraw@gmail.com"
          git add greenfield ui index.html app.mjs styles.css tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: complete mobile flow cleanup"
          git push origin HEAD:feature/mobile-flow-cleanup-v1
