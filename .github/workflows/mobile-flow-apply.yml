name: Mobile Flow Apply
on:
  push:
    branches: [feature/mobile-flow-cleanup-v1]
    paths:
      - scripts/apply-mobile-tests.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/mobile-flow-cleanup-v1
      - name: Apply final staged fix
        run: python scripts/apply-mobile-tests.py
      - name: Commit generated source changes
        run: |
          git config user.name "pureekangraw-ops"
          git config user.email "pureekangraw@gmail.com"
          git add sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh production asset revision"
          git push origin HEAD:feature/mobile-flow-cleanup-v1
