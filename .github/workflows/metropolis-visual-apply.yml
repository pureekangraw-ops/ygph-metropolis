name: Temporary METROPOLIS Visual Apply

on:
  push:
    branches:
      - design/ygph-metropolis-icon-system

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[visual-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out visual branch
        uses: actions/checkout@v4
        with:
          ref: design/ygph-metropolis-icon-system
      - name: Apply asserted visual transforms
        run: python3 scripts/apply-metropolis-visual-system.py
      - name: Verify patch shape
        run: git diff --check
      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow-era.js metropolis-v4.js metropolis-r5-1.js metropolis-v4.css index.html
          if git diff --cached --quiet; then
            echo "No visual source changes to commit"
            exit 0
          fi
          git commit -m "feat: apply shared METROPOLIS visual authorities [visual-applied]"
          git push origin HEAD:design/ygph-metropolis-icon-system
