name: Temporary METROPOLIS Visual Finalize

on:
  push:
    branches:
      - design/ygph-metropolis-icon-system

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[visual-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ygph-metropolis-icon-system
      - run: python3 scripts/finalize-metropolis-visual-authority.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow-era.js metropolis-v4.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: finalize shared visual authority [visual-finalized]"
          git push origin HEAD:design/ygph-metropolis-icon-system
