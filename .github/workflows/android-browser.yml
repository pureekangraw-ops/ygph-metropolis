name: Android Browser Foundation

on:
  pull_request:
    paths:
      - "android-browser/**"
  push:
    branches: [main]
    paths:
      - "android-browser/**"

permissions:
  contents: read

jobs:
  android-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: JVM unit tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/android-browser-unit-tests.log"
      - name: Publish JVM test diagnostics
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/android-browser-unit-tests.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Debug APK build
        run: gradle --no-daemon :app:assembleDebug
