name: Android Browser Foundation

on:
  pull_request:
    paths:
      - "android-browser/**"
  push:
    branches: [main]
    paths:
      - "android-browser/**"

permissions:
  contents: read

jobs:
  android-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests, lint, and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
