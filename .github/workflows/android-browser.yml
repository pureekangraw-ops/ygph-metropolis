name: Android Browser Foundation

on:
  pull_request:
    paths:
      - "android-browser/**"
  push:
    branches: [main]
    paths:
      - "android-browser/**"

permissions:
  contents: read

jobs:
  android-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: JVM unit tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/android-browser-unit-tests.log"
      - name: Publish JVM test diagnostics
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/android-browser-unit-tests.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Gradle failure lines
        if: ${{ failure() }}
        shell: bash
        run: |
          while IFS= read -r line; do
            safe="${line//'%'/'%25'}"
            safe="${safe//$'\r'/'%0D'}"
            safe="${safe//$'\n'/'%0A'}"
            echo "::error title=Gradle::$safe"
          done < <(tail -n 120 "$RUNNER_TEMP/android-browser-unit-tests.log")
      - name: Upload JVM test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-browser-jvm-test-diagnostics
          path: |
            ${{ github.workspace }}/android-browser/app/build/test-results/testDebugUnitTest
            ${{ github.workspace }}/android-browser/app/build/reports/tests/testDebugUnitTest
            ${{ runner.temp }}/android-browser-unit-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Debug APK build
        run: gradle --no-daemon :app:assembleDebug
