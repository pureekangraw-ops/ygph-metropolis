name: Android Browser Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Stamp the exact checked-out source into the APK, with a direct link to this build.
env:
  OBSERVATORY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  OBSERVATORY_BUILD_RUN_ID: ${{ github.run_id }}

jobs:
  android-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-browser
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: DOM targeting regression tests
        run: |
          set -o pipefail
          node --test tests/*.test.mjs ../remote-browser/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/android-browser-dom-tests.log"
      - name: Publish DOM test diagnostics
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/android-browser-dom-tests.log" >> "$GITHUB_STEP_SUMMARY"
      - name: JVM unit tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/android-browser-unit-tests.log"
      - name: Publish JVM test diagnostics
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/android-browser-unit-tests.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Gradle failure lines
        if: ${{ failure() }}
        shell: bash
        run: |
          grep -E '(^e:|error:|ERROR|FAILURE|Execution failed|What went wrong|There were failing tests|tests failed|Caused by:|Unresolved reference|Exception)' "$RUNNER_TEMP/android-browser-unit-tests.log" | tail -n 80 | while IFS= read -r line; do
            safe="${line//'%'/'%25'}"
            safe="${safe//$'\r'/'%0D'}"
            safe="${safe//$'\n'/'%0A'}"
            echo "::error title=Gradle::$safe"
          done
      - name: Upload JVM test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-browser-jvm-test-diagnostics
          path: |
            ${{ github.workspace }}/android-browser/app/build/test-results/testDebugUnitTest
            ${{ github.workspace }}/android-browser/app/build/reports/tests/testDebugUnitTest
            ${{ runner.temp }}/android-browser-unit-tests.log
            ${{ runner.temp }}/android-browser-dom-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Android instrumentation compile
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin
      - name: Debug APK build
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and upload debug APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          installer="app/build/outputs/apk/debug/YGG-Observatory-Remote.apk"
          cp "$apk" "$installer"
          sha256sum "$installer" | tee "$installer.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$installer" | tee "$installer.signing.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$installer" > "$installer.package.txt"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YGG-Observatory-Remote
          path: |
            android-browser/app/build/outputs/apk/debug/YGG-Observatory-Remote.apk
            android-browser/app/build/outputs/apk/debug/YGG-Observatory-Remote.apk.sha256
            android-browser/app/build/outputs/apk/debug/YGG-Observatory-Remote.apk.signing.txt
            android-browser/app/build/outputs/apk/debug/YGG-Observatory-Remote.apk.package.txt
          retention-days: 14

      - name: Build compact ARM64 installer
        env:
          OBSERVATORY_ARM64_ONLY: "true"
          OBSERVATORY_PARALLEL_PREVIEW: "true"
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:clean :app:assembleDebug
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          # The Preview package must not replace the installed owner app.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.big.gobrowser.preview'"
          installer="app/build/outputs/apk/debug/YGG-Observatory-Remote-ARM64-Preview.apk"
          # Gradle compresses native libraries with a fast level by default;
          # re-compress only the ARM64 APK with deflate level 9, then zipalign
          # and sign again using this build's original debug key.
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          source="app/build/outputs/apk/debug/app-debug.apk"
          target="app/build/outputs/apk/debug/arm64-compressed-unsigned.apk"
          with ZipFile(source) as src, ZipFile(target, "w", compression=ZIP_DEFLATED, compresslevel=9) as dst:
              for info in src.infolist():
                  if info.filename.startswith("META-INF/") and info.filename.endswith((".RSA",".DSA",".EC",".SF")):
                      continue
                  dst.writestr(info, src.read(info.filename),
                               compress_type=info.compress_type,
                               compresslevel=9 if info.compress_type == ZIP_DEFLATED else None)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 "app/build/outputs/apk/debug/arm64-compressed-unsigned.apk" "app/build/outputs/apk/debug/arm64-compressed-aligned.apk"
          # CI runners do not always use the conventional ~/.android debug keystore.
          # Generate an explicitly ephemeral test signer; never treat as release signing.
          signing_key="$RUNNER_TEMP/observatory-arm64-test.jks"
          keytool -genkeypair -noprompt \
            -keystore "$signing_key" -alias observatorydebug \
            -keyalg RSA -keysize 3072 -validity 90 \
            -storepass android -keypass android \
            -dname "CN=Observatory Testing, OU=Development, O=BIG, C=TH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$signing_key" \
            --ks-key-alias observatorydebug \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$installer" "app/build/outputs/apk/debug/arm64-compressed-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$installer" | tee "$installer.signing.txt"
          sha256sum "$installer" | tee "$installer.sha256"
          bytes="$(stat -c %s "$installer")"
          echo "ARM64_SIGNED_APK_BYTES=$bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 104857600
      - name: Upload compact ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: YGG-Observatory-Remote-ARM64-Preview
          path: |
            android-browser/app/build/outputs/apk/debug/YGG-Observatory-Remote-ARM64-Preview.apk
            android-browser/app/build/outputs/apk/debug/YGG-Observatory-Remote-ARM64-Preview.apk.sha256
            android-browser/app/build/outputs/apk/debug/YGG-Observatory-Remote-ARM64-Preview.apk.signing.txt
          retention-days: 14

  observatory-emulator:
    needs: android-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned GO typed adapter for cross-runtime proof
        uses: actions/checkout@v5
        with:
          repository: pureekangraw-ops/Go-Together
          # Exact open PR #22 candidate, paired to Observatory typed-transfer contract PR #262.
          ref: bef8e0334663b33db92b3c748971bbc3d821dd17
          path: .goview-go-contract
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      # sdkmanager occasionally receives a corrupt/truncated archive (upstream issue #496).
      # Preinstall the exact packages used by the runner action with bounded retries so
      # the action's later install sees verified package metadata instead of redownloading.
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
      - name: Install emulator SDK packages with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          install_package() {
            local package="$1"
            local package_dir="$2"
            for attempt in 1 2 3; do
              echo "Installing $package (attempt $attempt/3)"
              if sdkmanager --install "$package" --channel=0 && test -f "$package_dir/package.xml"; then
                return 0
              fi
              echo "SDK package install was incomplete; removing partial package before retry." >&2
              rm -rf "$package_dir"
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
            done
            echo "::error::Could not install verified Android SDK package: $package"
            return 1
          }
          install_package "build-tools;37.0.0" "$ANDROID_HOME/build-tools/37.0.0"
          install_package "platform-tools" "$ANDROID_HOME/platform-tools"
          install_package "platforms;android-35" "$ANDROID_HOME/platforms/android-35"
          install_package "emulator" "$ANDROID_HOME/emulator"
          install_package "system-images;android-35;google_apis;x86_64" "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GOVIEW_GO_ADAPTER: ${{ github.workspace }}/.goview-go-contract/worker/goview-direct.mjs
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android-browser/scripts/emulator-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observatory-emulator-evidence
          path: |
            android-browser/app/build/reports/androidTests/connected
            android-browser/app/build/outputs/androidTest-results/connected
            android-browser/app/build/emulator-evidence
          retention-days: 14
