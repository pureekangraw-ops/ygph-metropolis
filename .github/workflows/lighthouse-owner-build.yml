name: LIGHTHOUSE Owner Build

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or commit to build
        required: true
        default: codex/lighthouse-new-base-20260902
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-owner-selected-ref:
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'pureekangraw-ops' && github.event.pull_request.head.ref == 'codex/lighthouse-new-base-20260902')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell
    steps:
      - name: Checkout owner-selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.event.pull_request.head.sha }}

      - name: Show exact source commit
        run: git rev-parse HEAD
        working-directory: .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Run Android packaging and identity tests
        run: npm test

      - name: Stage LIGHTHOUSE NEW BASE
        run: npm run app:stage-new-base

      - name: Generate Android project
        run: npx cap add android

      - name: Sync exact staged web assets
        run: npx cap sync android

      - name: Apply canonical Android version
        run: node tools/set-android-version.mjs

      - name: Apply LIGHTHOUSE updater Android owner
        run: npm run android:updater:apply

      - name: Apply generated Android security baseline
        run: npm run android:security:apply

      - name: Materialize merged release manifest
        run: cd android && ./gradlew :app:processReleaseMainManifest

      - name: Verify generated Android security
        run: npm run android:security:verify

      - name: Build unsigned release APK
        run: npm run android:release

      - name: Materialize canonical APK signer
        env:
          LIGHTHOUSE_APK_KEYSTORE_BASE64: ${{ secrets.LIGHTHOUSE_APK_KEYSTORE_BASE64 }}
          LIGHTHOUSE_APK_STORE_PASSWORD: ${{ secrets.LIGHTHOUSE_APK_STORE_PASSWORD }}
          LIGHTHOUSE_APK_KEY_ALIAS: ${{ secrets.LIGHTHOUSE_APK_KEY_ALIAS }}
          LIGHTHOUSE_APK_KEY_PASSWORD: ${{ secrets.LIGHTHOUSE_APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in LIGHTHOUSE_APK_KEYSTORE_BASE64 LIGHTHOUSE_APK_STORE_PASSWORD LIGHTHOUSE_APK_KEY_ALIAS LIGHTHOUSE_APK_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "$name is not configured"; exit 1; fi
          done
          umask 077
          keystore="$RUNNER_TEMP/lighthouse-apk-release.p12"
          aligned_apk="$RUNNER_TEMP/lighthouse-release-aligned.apk"
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="android/app/build/outputs/apk/release/lighthouse-release.apk"
          trap 'rm -f "$keystore" "$aligned_apk"' EXIT
          printf '%s' "$LIGHTHOUSE_APK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          zipalign="$build_tools/zipalign"
          test -x "$apksigner" && test -x "$aapt" && test -x "$zipalign"
          "$zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-pass "env:LIGHTHOUSE_APK_STORE_PASSWORD" \
            --ks-key-alias "$LIGHTHOUSE_APK_KEY_ALIAS" \
            --key-pass "env:LIGHTHOUSE_APK_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$aligned_apk"
          "$apksigner" verify "$signed_apk"
          echo "APKSIGNER=$apksigner" >> "$GITHUB_ENV"
          echo "AAPT=$aapt" >> "$GITHUB_ENV"

      - name: Verify final APK identity
        run: APK_SOURCE_COMMIT="$(git rev-parse HEAD)" node tools/verify-apk-identity.mjs android/app/build/outputs/apk/release/lighthouse-release.apk release/apk-identity-evidence.json

      - name: Publish 2.0.2 test-channel APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="lighthouse-2.0.2-test"
          release_apk="$RUNNER_TEMP/LIGHTHOUSE-2.0.2.apk"
          cp android/app/build/outputs/apk/release/lighthouse-release.apk "$release_apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$release_apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$release_apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "LIGHTHOUSE 2.0.2 Owner Test" \
              --notes "Owner test-channel build only. Device acceptance is still required before final release." \
              --prerelease
          fi

      - name: Upload owner-test APK
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-2.0.2-owner-test
          path: |
            android-shell/android/app/build/outputs/apk/release/lighthouse-release.apk
            android-shell/release/apk-identity-evidence.json
            android-shell/release/android-security-evidence.json
          if-no-files-found: error
          retention-days: 14
