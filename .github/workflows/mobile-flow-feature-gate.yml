name: Mobile Flow Feature Gate
on:
  push:
    branches: [feature/mobile-flow-cleanup-v1]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run deploy:gate
