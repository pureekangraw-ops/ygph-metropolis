name: LIGHTHOUSE Existing APK Repair Verify

on:
  pull_request:
    paths:
      - 'tests/lighthouse-existing-apk-repair.test.cjs'
      - 'android-shell/test/effective-snapshot.test.mjs'
      - 'android-shell/test/patch-effective-snapshot-integration.test.mjs'
      - 'android-shell/test/effective-base-manifest.test.mjs'
      - 'android-shell/test/canonical-overlay.test.mjs'
      - 'android-shell/www/patch/effective-snapshot.mjs'
      - 'android-shell/www/patch/effective-store.mjs'
      - 'android-shell/www/patch/canonical-overlay.mjs'
      - 'android-shell/www/patch/patch-store.mjs'
      - 'android-shell/tools/build-effective-base-manifest.mjs'
      - 'android-shell/tools/stage-existing-full-app.mjs'
      - 'ui/release-status.mjs'
      - 'lighthouse/intent-vocabulary.mjs'
      - '.github/workflows/lighthouse-existing-apk-repair-verify.yml'

permissions:
  contents: read

jobs:
  repair-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/lighthouse-existing-apk-repair.test.cjs
      - run: node --test android-shell/test/effective-snapshot.test.mjs android-shell/test/patch-effective-snapshot-integration.test.mjs android-shell/test/effective-base-manifest.test.mjs android-shell/test/canonical-overlay.test.mjs
