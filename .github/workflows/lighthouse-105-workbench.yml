name: LIGHTHOUSE 1.0.5 Workbench

on:
  push:
    branches:
      - feat/lighthouse-1.0.5-real-app

permissions:
  contents: write

jobs:
  gate-a-c:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply Gate C single-Calendar changes
        run: node scripts/apply-lighthouse-105-gate-c.mjs
      - name: Apply Gate A source and cache changes
        run: node scripts/apply-lighthouse-105-gate-a.mjs
      - name: Verify LIGHTHOUSE 1.0.5 regression suite
        id: verify
        shell: bash
        run: |
          set +e
          npm run deploy:gate > /tmp/lighthouse-105-gate.log 2>&1
          code=$?
          cat /tmp/lighthouse-105-gate.log
          if [ "$code" -ne 0 ]; then
            mkdir -p docs
            {
              echo "# LIGHTHOUSE 1.0.5 workbench diagnostic"
              echo
              echo "Exit code: $code"
              echo
              echo "## Failed tests"
              echo '```text'
              grep -n -B 16 -A 28 '^not ok ' /tmp/lighthouse-105-gate.log || true
              echo '```'
              echo
              echo "## Summary tail"
              echo '```text'
              tail -n 80 /tmp/lighthouse-105-gate.log
              echo '```'
            } > docs/lighthouse-105-workbench-failure.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/lighthouse-105-workbench-failure.md
            git commit -m "diagnostic: capture LIGHTHOUSE 1.0.5 failure details" || true
            git push origin HEAD:feat/lighthouse-1.0.5-real-app || true
            exit "$code"
          fi
      - name: Commit verified source changes
        shell: bash
        run: |
          rm -f docs/lighthouse-105-workbench-failure.md
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lighthouse.css ui/lighthouse-shell.mjs ui/manual-finance-ui.mjs tests/greenfield-login-ux.test.cjs RELEASE_MANIFEST.json sw.js docs/lighthouse-105-workbench-failure.md
          git commit -m "workbench: apply LIGHTHOUSE 1.0.5 verified source changes"
          git push origin HEAD:feat/lighthouse-1.0.5-real-app
