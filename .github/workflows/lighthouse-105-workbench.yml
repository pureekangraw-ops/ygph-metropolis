name: LIGHTHOUSE 1.0.5 Workbench

on:
  push:
    branches:
      - feat/lighthouse-1.0.5-real-app

permissions:
  contents: write

jobs:
  gate-a:
    if: "${{ github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'workbench: apply LIGHTHOUSE 1.0.5 Gate A') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply Gate A source changes
        run: node scripts/apply-lighthouse-105-gate-a.mjs
      - name: Verify Gate A and regression suite
        run: npm run deploy:gate
      - name: Commit verified Gate A changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lighthouse.css ui/lighthouse-shell.mjs
          git commit -m "workbench: apply LIGHTHOUSE 1.0.5 Gate A"
          git push origin HEAD:feat/lighthouse-1.0.5-real-app
