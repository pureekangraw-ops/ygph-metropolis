name: LIGHTHOUSE 1.0.5 Workbench

on:
  push:
    branches:
      - feat/lighthouse-1.0.5-real-app

permissions:
  contents: write

jobs:
  gate-a-e:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7.0.0
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/apply-lighthouse-105-gate-c.mjs
      - run: node scripts/apply-lighthouse-105-gate-d.mjs
      - run: node scripts/apply-lighthouse-105-gate-e.mjs
      - run: node scripts/repair-lighthouse-105-test-contracts.mjs
      - run: node scripts/apply-lighthouse-105-gate-a.mjs
      - name: Persist generated candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lighthouse.css ui/lighthouse-shell.mjs ui/master-input.mjs ui/manual-finance-ui.mjs ui/settings-ui.mjs ui/app-update.mjs android-shell/tools/apply-android-updater.mjs android-shell/test/app-update.test.mjs android-shell/test/settings-update-state.test.mjs android-shell/test/managed-artifact-activation.test.mjs tests/master-input-ui-fixture.cjs tests/greenfield-login-ux.test.cjs tests/greenfield-lighthouse-intent-question.test.cjs tests/greenfield-lighthouse-phase1-final-gate.test.cjs tests/greenfield-manual-context-bridge.test.cjs tests/settings-utility.test.cjs RELEASE_MANIFEST.json sw.js
          if ! git diff --cached --quiet; then git commit -m "workbench: materialize LIGHTHOUSE 1.0.5 Gates A-E"; git push origin HEAD:feat/lighthouse-1.0.5-real-app; fi
      - name: Verify web regression suite
        run: npm run deploy:gate
      - name: Verify Android suite with exact diagnostic
        shell: bash
        working-directory: android-shell
        run: |
          set +e
          npm install --no-audit --no-fund
          npm test 2>&1 | tee /tmp/android.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            cd ..
            {
              echo '# LIGHTHOUSE 1.0.5 Android exact failures'
              echo
              echo '```text'
              grep -B 3 -A 24 '^not ok ' /tmp/android.log || true
              echo
              tail -n 25 /tmp/android.log
              echo '```'
            } > docs/lighthouse-105-android-failure.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/lighthouse-105-android-failure.md
            git commit -m "diagnostic: capture exact Android failures"
            git push origin HEAD:feat/lighthouse-1.0.5-real-app
            exit "$code"
          fi
      - name: Clear diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for f in docs/lighthouse-105-workbench-failure.md docs/lighthouse-105-android-failure.md; do if [ -f "$f" ]; then git rm "$f"; changed=1; fi; done
          if [ "$changed" -eq 1 ]; then git commit -m "chore: clear LIGHTHOUSE 1.0.5 diagnostics"; git push origin HEAD:feat/lighthouse-1.0.5-real-app; fi
