name: LIGHTHOUSE 1.0.5 Workbench

on:
  push:
    branches:
      - feat/lighthouse-1.0.5-real-app

permissions:
  contents: write

jobs:
  gate-a-e:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply Gate C single-Calendar changes
        run: node scripts/apply-lighthouse-105-gate-c.mjs
      - name: Apply Gate D human-copy changes
        run: node scripts/apply-lighthouse-105-gate-d.mjs
      - name: Apply Gate E updater changes
        run: node scripts/apply-lighthouse-105-gate-e.mjs
      - name: Apply Gate A source and cache changes
        run: node scripts/apply-lighthouse-105-gate-a.mjs
      - name: Verify web regression suite
        shell: bash
        run: npm run deploy:gate
      - name: Verify updater unit suite
        shell: bash
        working-directory: android-shell
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Commit verified source changes
        shell: bash
        run: |
          rm -f docs/lighthouse-105-workbench-failure.md
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lighthouse.css ui/lighthouse-shell.mjs ui/master-input.mjs ui/manual-finance-ui.mjs ui/settings-ui.mjs ui/app-update.mjs android-shell/tools/apply-android-updater.mjs android-shell/test/app-update.test.mjs tests/greenfield-login-ux.test.cjs RELEASE_MANIFEST.json sw.js docs/lighthouse-105-workbench-failure.md
          git commit -m "workbench: apply LIGHTHOUSE 1.0.5 Gates A-E"
          git push origin HEAD:feat/lighthouse-1.0.5-real-app
