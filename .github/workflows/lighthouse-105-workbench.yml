name: LIGHTHOUSE 1.0.5 Workbench

on:
  push:
    branches:
      - feat/lighthouse-1.0.5-real-app

permissions:
  contents: write

jobs:
  gate-a-e:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply Gate C single-Calendar changes
        run: node scripts/apply-lighthouse-105-gate-c.mjs
      - name: Apply Gate D human-copy changes
        run: node scripts/apply-lighthouse-105-gate-d.mjs
      - name: Apply Gate E updater changes
        run: node scripts/apply-lighthouse-105-gate-e.mjs
      - name: Restore stable tests and patch only intentional contracts
        run: node scripts/repair-lighthouse-105-test-contracts.mjs
      - name: Apply Gate A source and cache changes
        run: node scripts/apply-lighthouse-105-gate-a.mjs
      - name: Persist generated Gate A-E candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html lighthouse.css \
            ui/lighthouse-shell.mjs ui/master-input.mjs ui/manual-finance-ui.mjs ui/settings-ui.mjs ui/app-update.mjs \
            android-shell/tools/apply-android-updater.mjs \
            android-shell/test/app-update.test.mjs android-shell/test/settings-update-state.test.mjs android-shell/test/managed-artifact-activation.test.mjs \
            tests/master-input-ui-fixture.cjs tests/greenfield-login-ux.test.cjs tests/greenfield-lighthouse-intent-question.test.cjs \
            tests/greenfield-lighthouse-phase1-final-gate.test.cjs tests/greenfield-manual-context-bridge.test.cjs \
            tests/settings-utility.test.cjs \
            RELEASE_MANIFEST.json sw.js
          if git diff --cached --quiet; then
            echo "No generated changes to persist"
          else
            git commit -m "workbench: materialize LIGHTHOUSE 1.0.5 Gates A-E"
            git push origin HEAD:feat/lighthouse-1.0.5-real-app
          fi
      - name: Verify web regression suite
        run: npm run deploy:gate
      - name: Verify updater unit suite
        shell: bash
        working-directory: android-shell
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Remove stale diagnostic
        shell: bash
        run: |
          if [ ! -f docs/lighthouse-105-workbench-failure.md ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm docs/lighthouse-105-workbench-failure.md
          git commit -m "chore: clear LIGHTHOUSE 1.0.5 workbench diagnostic"
          git push origin HEAD:feat/lighthouse-1.0.5-real-app
