name: Trusted Device Transform

on:
  push:
    branches:
      - feat/trusted-device-auto-unlock

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[trusted-device-transform]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/trusted-device-auto-unlock
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted transform
        run: node scripts/apply-trusted-device.mjs
      - name: Remove temporary transform tooling
        run: rm scripts/apply-trusted-device.mjs .github/workflows/trusted-device-transform.yml
      - name: Verify focused trusted-device tests
        run: node --test tests/trusted-device-unlock.test.cjs
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add trusted-device auto-unlock [trusted-device-transform]"
          git push origin HEAD:feat/trusted-device-auto-unlock
