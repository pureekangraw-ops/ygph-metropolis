name: Mobile CSS Hotfix Gate
on:
  push:
    branches: [hotfix/mobile-css-gate-v1]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run deploy:gate
