name: Temporary YGPH Visual Publication Finalize

on:
  push:
    branches:
      - design/ygph-metropolis-icon-system

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[visual-publication-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ygph-metropolis-icon-system
      - run: python3 scripts/finalize-ygph-visual-publication.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow-era-3.5.js tests/defrag-publication-followthrough.test.cjs tests/metropolis-4.2-schedule.test.cjs tests/metropolis-status-signal.test.cjs tests/icon-system.test.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: finalize YGPH visual publication contracts [visual-publication-finalized]"
          git push origin HEAD:design/ygph-metropolis-icon-system
