name: Store Ride Preflight

on:
  push:
    branches:
      - feature/store-ride-truth-flow-v1

permissions:
  contents: read

jobs:
  preflight:
    name: Store Ride preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Compute production asset revision
        run: |
          node - <<'NODE' > asset-revision.txt
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const manifest=JSON.parse(fs.readFileSync('RELEASE_MANIFEST.json','utf8'));
          const hash=crypto.createHash('sha256');
          const paths=manifest.productionFiles.map(item=>item.path).filter(file=>file!=='sw.js').sort();
          for(const file of paths){hash.update(file);hash.update('\0');hash.update(fs.readFileSync(file));hash.update('\0');}
          console.log(`sha256-${hash.digest('hex').slice(0,16)}`);
          NODE
      - name: Upload production asset revision
        uses: actions/upload-artifact@v4
        with:
          name: store-ride-asset-revision
          path: asset-revision.txt
      - name: Run project tests
        run: npm test
      - name: Check syntax
        run: npm run check:syntax
      - name: Check UTF-8
        run: npm run check:utf8
