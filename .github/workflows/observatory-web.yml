name: Observatory Web Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check observatory-web/worker.mjs
      - run: npm test

  remote-browser-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test worker policy
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Bundle Cloudflare Worker without deploying
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir dist
      - name: Package remote Worker for the next TEST phase
        uses: actions/upload-artifact@v4
        with:
          name: observatory-shared-browser-worker
          path: remote-browser/dist
          if-no-files-found: error
          retention-days: 14
