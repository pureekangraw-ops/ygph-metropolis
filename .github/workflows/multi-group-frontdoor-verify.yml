name: Multi Group Frontdoor Verify

on:
  push:
    branches:
      - feature/lighthouse-multi-group-frontdoor-20260830

permissions:
  contents: read

jobs:
  verify:
    name: Multi-group frontdoor verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontdoor targeted gate
        run: node --test --test-concurrency=1 tests/greenfield-lighthouse-multi-group*.test.cjs tests/greenfield-lighthouse-phase1-recovery-*.test.cjs
      - name: Run serial full test suite
        run: node --test --test-concurrency=1 tests/greenfield-*.test.cjs
      - name: Run normal full test suite
        run: npm test
      - name: Check syntax
        run: npm run check:syntax
      - name: Check UTF-8
        run: npm run check:utf8
