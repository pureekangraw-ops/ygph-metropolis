name: Phase 2A One-Shot Source Patcher

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-app-source:
    if: github.head_ref == 'hardening/domain-command-ownership-2a'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2A branch
        uses: actions/checkout@v4
        with:
          ref: hardening/domain-command-ownership-2a
          fetch-depth: 0

      - name: Apply deterministic app ownership patch
        run: python3 scripts/phase2a_patch_app.py

      - name: Verify patch changed only intended source before cleanup
        run: |
          git diff -- app.js
          test -n "$(git status --porcelain app.js)"

      - name: Commit patched source and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm scripts/phase2a_patch_app.py .github/workflows/phase2a-source-patcher.yml
          git commit -m "refactor: route ledger calendar mutations through commands"
          git push origin HEAD:hardening/domain-command-ownership-2a
