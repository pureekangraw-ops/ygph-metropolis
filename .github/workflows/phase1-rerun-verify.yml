name: Phase 1 Rerun Verify

on:
  push:
    branches:
      - feature/lighthouse-intent-phase1-rerun-20260829

permissions:
  contents: read

jobs:
  verify:
    name: Phase 1 rerun verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run P1.2 numeric decoder tests
        run: node --test tests/greenfield-lighthouse-intent-number.test.cjs
