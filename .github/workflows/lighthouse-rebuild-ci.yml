name: LIGHTHOUSE Rebuild CI

on:
  push:
    branches:
      - feat/lighthouse-1.0.0-rebuild
  pull_request:
    paths:
      - 'android-shell/**'
      - '.github/workflows/lighthouse-rebuild-ci.yml'

permissions:
  contents: read

jobs:
  workunits:
    name: WorkUnit contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run LIGHTHOUSE WorkUnit tests
        run: node --test test/workunit*.test.mjs
