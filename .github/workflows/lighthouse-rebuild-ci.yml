name: LIGHTHOUSE Rebuild CI

on:
  push:
    branches:
      - feat/lighthouse-1.0.0-rebuild
      - test/ledger-gateway-full-suite-baseline-20260905
  pull_request:
    paths:
      - 'android-shell/**'
      - '.github/workflows/lighthouse-rebuild-ci.yml'

permissions:
  contents: read

jobs:
  workunits:
    name: WorkUnit contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Sync trusted packaged sources
        run: npm run pretest
      - name: Run LIGHTHOUSE WorkUnit tests
        run: node --test test/workunit*.test.mjs
      - name: Run full Android-shell regression
        run: npm test

  android-native-shell:
    name: Native Android shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-shell
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npm run android:add
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Apply Android security baseline
        run: npm run android:security:apply
      - name: Wire native updater and release identity
        run: node tools/apply-native-updater.mjs android
      - name: Generate merged release manifest
        run: cd android && ./gradlew processReleaseMainManifest
      - name: Verify Android security baseline
        run: npm run android:security:verify
      - name: Run native unit tests
        run: cd android && ./gradlew test
      - name: Compile native updater
        run: cd android && ./gradlew assembleDebug
      - name: Upload generated Android shell
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-generated-android-shell
          path: android-shell/android
          if-no-files-found: error
          retention-days: 3
