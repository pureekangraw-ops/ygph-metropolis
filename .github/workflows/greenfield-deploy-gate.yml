name: Greenfield Deploy Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-gate:
    name: Greenfield safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run Greenfield tests, syntax, and UTF-8 gates
        run: npm run deploy:gate
      - name: Validate Wrangler production config
        run: npx --yes wrangler@4.126.0 deploy --dry-run --env=""

  staging:
    name: Deploy Master Input candidate to staging
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: safety-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v7.0.1
      - name: Deploy staging Worker with provider disabled
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          command: deploy --env staging

  deploy:
    name: Deploy YGPH METROPOLIS Greenfield to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: safety-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out production commit
        uses: actions/checkout@v7.0.1
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.126.0"
          command: deploy --env=""
