name: Phase 2A One-Shot Publication Patcher

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  publish-r27:
    if: github.head_ref == 'hardening/domain-command-ownership-2a'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2A branch
        uses: actions/checkout@v4
        with:
          ref: hardening/domain-command-ownership-2a
          fetch-depth: 0

      - name: Apply atomic r27 publication patch
        run: python3 scripts/phase2a_publish.py

      - name: Verify release wiring before commit
        run: |
          grep -F 'v4.2.6-20260812-r27-domain-command-ownership' sw.js RELEASE_MANIFEST.json
          grep -F 'metropolis-domain-commands.js' index.html sw.js .assetsignore package.json RELEASE_MANIFEST.json SHA256SUMS.txt
          node --check metropolis-domain-commands.js
          git diff --check

      - name: Commit publication and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .assetsignore package.json RELEASE_MANIFEST.json SHA256SUMS.txt
          git rm scripts/phase2a_publish.py .github/workflows/phase2a-publication-patcher.yml
          git commit -m "chore: publish phase 2a runtime generation"
          git push origin HEAD:hardening/domain-command-ownership-2a
