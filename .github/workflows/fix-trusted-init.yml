name: Fix Trusted Init

on:
  push:
    branches:
      - feat/trusted-device-auto-unlock

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[trusted-init-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/trusted-device-auto-unlock
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted init fix
        run: node scripts/fix-trusted-init.mjs
      - name: Remove temporary tooling
        run: rm scripts/fix-trusted-init.mjs .github/workflows/fix-trusted-init.yml
      - name: Verify trusted-device tests
        run: node --test tests/trusted-device-unlock.test.cjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep init lifecycle after trusted unlock [trusted-init-fix]"
          git push origin HEAD:feat/trusted-device-auto-unlock
