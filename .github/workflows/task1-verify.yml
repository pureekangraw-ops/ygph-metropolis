name: Task 1 Verify

on:
  push:
    branches:
      - feature/lighthouse-intent-task1-parser

permissions:
  contents: read

jobs:
  verify:
    name: Task 1 full repo verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Check syntax
        run: npm run check:syntax
      - name: Check UTF-8
        run: npm run check:utf8
