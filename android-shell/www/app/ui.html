<main class="lighthouse-shell">
  <header class="lighthouse-topbar">
    <div class="lighthouse-brand" aria-label="LIGHTHOUSE">
      <span class="lighthouse-mark" aria-hidden="true">◈</span>
      <h1>LIGHTHOUSE</h1>
    </div>
    <button class="icon-button" type="button" data-settings-open aria-label="Settings" title="ตั้งค่า">⚙</button>
  </header>

  <section class="chat-stage" aria-label="บทสนทนา LIGHTHOUSE">
    <div class="chat-log" data-chat-log aria-live="polite">
      <div class="empty-chat" data-empty-state>
        <div class="empty-mark" aria-hidden="true">◈</div>
        <p>พิมพ์สิ่งที่คุณต้องการได้เลย</p>
      </div>
    </div>
    <div class="transient-notice" data-transient-notice hidden role="status"></div>
  </section>

  <form class="chat-composer" data-chat-form>
    <label class="sr-only" for="lighthouse-chat-input">ข้อความ</label>
    <textarea id="lighthouse-chat-input" data-chat-input rows="1" maxlength="1200" placeholder="พิมพ์สิ่งที่คุณต้องการ..." autocomplete="off" required></textarea>
    <button class="send-button" type="submit" aria-label="ส่งข้อความ">➤</button>
  </form>

  <section class="settings-sheet" data-settings-panel hidden aria-label="ตั้งค่า">
    <div class="settings-card">
      <header class="settings-head">
        <button class="icon-button" type="button" data-settings-close aria-label="กลับ">‹</button>
        <div><small>LIGHTHOUSE</small><h2>ตั้งค่า</h2></div>
      </header>

      <section class="settings-section" aria-labelledby="patch-settings-title">
        <div class="settings-title-row">
          <div><small>ระบบแอป</small><h3 id="patch-settings-title">Patch และ Rollback</h3></div>
          <span class="version-chip">v<span data-lighthouse-version>0.0.0</span></span>
        </div>
        <p class="settings-copy">อัปเดตด้วยไฟล์ที่เลือกจากเครื่องเท่านั้น ระบบตรวจสอบไฟล์ก่อนเปิดใช้ทุกครั้ง</p>
        <div class="settings-actions">
          <button class="primary-button" type="button" data-patch-import>เลือกไฟล์ Patch</button>
          <button class="danger-button" type="button" data-patch-rollback>Rollback</button>
        </div>
      </section>
    </div>
  </section>

  <div class="system-alert" data-system-alert role="alert" hidden>
    <div>
      <strong>มีปัญหาที่ต้องจัดการ</strong>
      <p data-system-alert-copy></p>
    </div>
    <button type="button" data-system-alert-close>ปิด</button>
  </div>
</main>
